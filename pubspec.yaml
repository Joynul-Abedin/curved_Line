name: curved_roadmap
description: A configurable Flutter widget for curved, winding roadmap and journey paths, with milestone markers, progress fill, gradients and draw-in animation.
version: 0.1.0
repository: https://github.com/Joynul-Abedin/curved_Line
issue_tracker: https://github.com/Joynul-Abedin/curved_Line/issues
topics:
  - roadmap
  - path
  - progress
  - animation
  - widget

screenshots:
  - description: A winding road with milestone markers and a progress fill showing completed steps.
    path: doc/screenshots/markers_progress.png
  - description: Marker cards carrying a title, notes and an icon, kept inside the widget bounds.
    path: doc/screenshots/marker_cards.png
  - description: A gradient road stroke with the draw-in entrance animation.
    path: doc/screenshots/gradient_animation.png
  - description: A road shaped by hand-placed waypoints mixing smooth and sharp turns.
    path: doc/screenshots/waypoints.png

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
